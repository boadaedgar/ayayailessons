<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeuroFit — nueva dirección</title>
  <link rel="canonical" href="https://boadaedgar.github.io/ayayailessons/curso02ay/neurofitness/" />
  <meta http-equiv="refresh" content="0; url=../curso02ay/neurofitness/" />
  <style>
    :root { --accent:#f5a623; --blue:#4fc3f7; --bg:#0f0f1a; --surface:#1a1a2e; --text:#e0e0e0; --muted:#888; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px; line-height: 1.5;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: var(--surface); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px; padding: 32px; max-width: 460px; text-align: center;
    }
    h1 { color: var(--accent); font-size: 1.3em; margin: 0 0 12px; }
    p { color: #bbb; margin: 0 0 20px; }
    a.btn {
      display: inline-block; background: rgba(245,166,35,0.1);
      border: 1px solid rgba(245,166,35,0.35); border-radius: 6px;
      padding: 10px 22px; color: var(--accent); text-decoration: none; font-weight: 600;
    }
    a.btn:hover { background: rgba(245,166,35,0.2); }
    .hint { font-size: 0.8em; color: var(--muted); margin-top: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Esta página se mudó</h1>
    <p>NeuroFit ahora vive en una dirección nueva. Te estamos llevando para allá automáticamente.</p>
    <a class="btn" href="../curso02ay/neurofitness/">Ir a NeuroFit</a>
    <div class="hint">Si no pasa nada en unos segundos, haz clic en el botón.</div>
  </div>
  <script>window.location.replace("../curso02ay/neurofitness/");</script>
</body>
</html>
